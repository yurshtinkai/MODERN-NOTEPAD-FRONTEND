<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/iconNotepad.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure note-taking made simple with offline access" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <title>Modern Notepad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for offline support with update checking
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered:', registration.scope);
              
              // Check for updates every hour
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000);
              
              // Listen for service worker updates
              registration.addEventListener('updatefound', () => {
                console.log('Service Worker: New version found');
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New service worker is ready, prompt user to reload
                      console.log('Service Worker: New version ready, reloading...');
                      // Force skip waiting and reload
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      window.location.reload();
                    }
                  });
                }
              });
              
              // Handle controller change (when new service worker takes over)
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('Service Worker: Controller changed, reloading...');
                window.location.reload();
              });
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
